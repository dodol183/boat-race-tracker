# Tests on every push and pull request; then the Android app, as a debug APK to install by hand.
# The latest build is published as the "test-build" pre-release, at a link a phone can open:
#   https://github.com/<owner>/<repo>/releases/download/test-build/boat-race-tracker-test.apk
# (and also kept with each run under Artifacts). The server address built into the app comes from the repository
# variable BRT_SERVER_URL (Settings → Secrets and variables → Actions → Variables); without it the
# app asks for the server on its join screen.
name: CI

on:
  # Pushes to main; a branch with a pull request is built by the pull_request run
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # To publish the test-build pre-release
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the pages
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.BRT_SERVER_URL }}
      - name: Build the cPanel package (server and website in one zip)
        run: node scripts/build-deploy.mjs
        env:
          BRT_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Copy them into the Android project
        run: npx cap sync android
        working-directory: packages/app
      - name: Build the APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: packages/app/android
      - uses: actions/upload-artifact@v4
        with:
          name: boat-race-tracker-debug-apk
          path: packages/app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish as the test-build pre-release
        # Not for pull requests from forks: their builds can't publish here
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cp packages/app/android/app/build/outputs/apk/debug/app-debug.apk boat-race-tracker-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build boat-race-tracker-test.apk deploy-out/boat-race-tracker-cpanel.zip \
            --prerelease \
            --target "$SHA" \
            --title "Test build (${BRANCH}, ${SHA:0:7})" \
            --notes "Test build from ${BRANCH} at ${SHA:0:7}.

          - boat-race-tracker-test.apk: the Android app (a debug build). Open this page on the phone, tap it, and allow installing from your browser when asked. Uninstall the previous test build first: each one is signed with a new debug key.
          - boat-race-tracker-cpanel.zip: the server and website for cPanel. Steps: docs/DEPLOY_CPANEL.md (also inside the zip as DEPLOY.md)."
